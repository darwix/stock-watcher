<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Box stats mock</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				--bg: #f4f3f0;
				--card: #ffffff;
				--card-2: #ebe9e4;
				--text: #17171a;
				--muted: #6f6c66;
				--line: #e0ddd6;
				--up: #1f8a4c;
				--down: #c2412d;
				--up-bg: #1f8a4c1f;
				--down-bg: #c2412d1f;
				--shadow: 0 1px 2px #2a241a14, 0 8px 24px -12px #2a241a29;
			}
			@media (prefers-color-scheme: dark) {
				:root:not([data-theme='light']) {
					--bg: #0e0f11;
					--card: #17191c;
					--card-2: #1f2226;
					--text: #ecebe8;
					--muted: #8d8a84;
					--line: #272a2f;
					--up: #4cc382;
					--down: #ef6f5a;
					--up-bg: #4cc38224;
					--down-bg: #ef6f5a24;
					--shadow: 0 1px 2px #0006, 0 12px 32px -16px #000a;
				}
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: var(--bg);
				color: var(--text);
				font-family: Geist, system-ui, sans-serif;
			}
			.num {
				font-family: 'Geist Mono', ui-monospace, monospace;
				font-variant-numeric: tabular-nums;
			}
			main {
				max-width: 1200px;
				margin: 0 auto;
				padding: 2rem 1rem 4rem;
			}
			.top {
				display: flex;
				flex-wrap: wrap;
				gap: 1rem;
				align-items: end;
				justify-content: space-between;
				margin-bottom: 1.5rem;
			}
			h1 {
				margin: 0;
				font-size: 1.6rem;
				font-weight: 600;
				letter-spacing: -0.02em;
			}
			.sub {
				color: var(--muted);
				font-size: 0.9rem;
				margin-top: 0.25rem;
			}
			nav {
				display: flex;
				gap: 4px;
				padding: 4px;
				max-width: 100%;
				overflow-x: auto;
				scrollbar-width: none;
				background: var(--card-2);
				border-radius: 10px;
			}
			nav button {
				border: 0;
				background: none;
				color: var(--muted);
				font:
					500 0.85rem Geist,
					sans-serif;
				padding: 0.45rem 0.8rem;
				white-space: nowrap;
				border-radius: 7px;
				cursor: pointer;
				transition:
					background 0.2s,
					color 0.2s;
			}
			nav button[aria-pressed='true'] {
				background: var(--card);
				color: var(--text);
				box-shadow: var(--shadow);
			}
			nav button:focus-visible,
			.x:focus-visible {
				outline: 2px solid var(--text);
				outline-offset: 2px;
			}
			.note {
				color: var(--muted);
				font-size: 0.85rem;
				margin: 0 0 1rem;
				max-width: 65ch;
			}
			.view:not(.on) {
				display: none;
			}
			.up {
				color: var(--up);
			}
			.down {
				color: var(--down);
			}
			.x {
				position: absolute;
				top: 0.6rem;
				right: 0.6rem;
				width: 28px;
				height: 28px;
				border: 0;
				border-radius: 6px;
				background: none;
				color: var(--muted);
				font-size: 1.1rem;
				cursor: pointer;
				opacity: 0;
				transition:
					opacity 0.2s,
					background 0.2s;
			}
			.box:hover .x,
			.x:focus-visible {
				opacity: 1;
			}
			.x:hover {
				background: var(--card-2);
			}
			@keyframes flash-up {
				from {
					background: var(--up-bg);
				}
			}
			@keyframes flash-down {
				from {
					background: var(--down-bg);
				}
			}
			.flash-up {
				animation: flash-up 1.2s ease-out;
			}
			.flash-down {
				animation: flash-down 1.2s ease-out;
			}

			/* A — uniform giant tiles */
			.a {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
				gap: 12px;
			}
			.a .box {
				position: relative;
				background: var(--card);
				border-radius: 16px;
				padding: 1.25rem 1.25rem 1.5rem;
				box-shadow: var(--shadow);
			}
			.a .tk {
				font-weight: 600;
				font-size: 1rem;
			}
			.a .nm {
				color: var(--muted);
				font-size: 0.8rem;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				padding-right: 2rem;
			}
			.a .px {
				font-size: clamp(2.6rem, 6vw, 3.4rem);
				font-weight: 500;
				letter-spacing: -0.04em;
				margin: 1.4rem 0 0.4rem;
				line-height: 1;
			}
			.a .ch {
				font-size: 0.95rem;
				font-weight: 500;
			}
			.a .t {
				color: var(--muted);
				font-size: 0.75rem;
				margin-top: 1rem;
			}

			/* B — bento with hero */
			.b {
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				grid-auto-rows: 150px;
				gap: 12px;
			}
			.b .box {
				position: relative;
				background: var(--card);
				border-radius: 18px;
				padding: 1rem 1.1rem;
				box-shadow: var(--shadow);
				display: flex;
				flex-direction: column;
				justify-content: space-between;
			}
			.b .box:first-child {
				grid-column: span 2;
				grid-row: span 2;
				padding: 1.5rem;
			}
			.b .tk {
				font-weight: 600;
			}
			.b .px {
				font-size: 2rem;
				font-weight: 500;
				letter-spacing: -0.03em;
				line-height: 1;
			}
			.b .box:first-child .px {
				font-size: clamp(3.5rem, 9vw, 6rem);
			}
			.b .box:first-child .tk {
				font-size: 1.3rem;
			}
			.b .ch {
				font-size: 0.85rem;
				font-weight: 500;
			}
			.b .nm {
				color: var(--muted);
				font-size: 0.8rem;
			}
			.b svg {
				width: 100%;
				height: 70px;
				margin: auto 0 0.5rem;
			}
			@media (max-width: 720px) {
				.b {
					grid-template-columns: 1fr 1fr;
				}
			}

			/* C — heatmap */
			.c {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
				grid-auto-rows: 170px;
				gap: 6px;
			}
			.c .box {
				position: relative;
				border-radius: 10px;
				padding: 1rem;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				text-align: center;
				color: #fff;
			}
			.c .tk {
				font-size: 1.6rem;
				font-weight: 700;
				letter-spacing: -0.02em;
			}
			.c .px {
				font-size: 1.05rem;
				opacity: 0.85;
				margin-top: 0.2rem;
			}
			.c .ch {
				font-size: 1.25rem;
				font-weight: 600;
				margin-top: 0.4rem;
			}
			.c .x {
				color: #fffc;
			}
			.c .x:hover {
				background: #0002;
			}

			/* D — terminal board */
			.d {
				background: #0b0c0d;
				color: #d9d6cf;
				border-radius: 14px;
				padding: 6px;
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
				gap: 6px;
				--up: #5bd68f;
				--down: #ff7a63;
				--up-bg: #5bd68f33;
				--down-bg: #ff7a6333;
			}
			.d .box {
				position: relative;
				background: #131517;
				border-radius: 8px;
				padding: 1rem 1.1rem;
				font-family: 'Geist Mono', monospace;
			}
			.d .row {
				display: flex;
				justify-content: space-between;
				font-size: 0.8rem;
				color: #7d7a74;
				text-transform: uppercase;
				letter-spacing: 0.06em;
			}
			.d .tk {
				color: #d9d6cf;
				font-weight: 600;
			}
			.d .px {
				font-size: clamp(2.8rem, 7vw, 4rem);
				font-weight: 500;
				letter-spacing: -0.04em;
				line-height: 1.1;
				margin: 0.6rem 0 0.2rem;
			}
			.d .ch {
				font-size: 0.95rem;
			}
			.d .x {
				top: auto;
				bottom: 0.6rem;
				color: #7d7a74;
			}
			.d .x:hover {
				background: #fff1;
			}
		</style>
	</head>
	<body>
		<main>
			<div class="top">
				<div>
					<h1>IDX watchlist</h1>
					<div class="sub">Mock · prices tick every 3s to preview the update flash</div>
				</div>
				<nav aria-label="Layout alternatives">
					<button data-v="a" aria-pressed="true">A · Tiles</button>
					<button data-v="b" aria-pressed="false">B · Bento</button>
					<button data-v="c" aria-pressed="false">C · Heatmap</button>
					<button data-v="d" aria-pressed="false">D · Terminal</button>
				</nav>
			</div>

			<p class="note" id="note"></p>
			<section class="view a on" id="a"></section>
			<section class="view b" id="b"></section>
			<section class="view c" id="c"></section>
			<section class="view d" id="d"></section>
		</main>

		<script>
			const stocks = [
				['BBCA', 'Bank Central Asia', 4990, 4820],
				['TLKM', 'Telkom Indonesia', 1990, 1770],
				['BBRI', 'Bank Rakyat Indonesia', 3870, 3910],
				['ASII', 'Astra International', 5125, 5100],
				['GOTO', 'GoTo Gojek Tokopedia', 68, 71],
				['BMRI', 'Bank Mandiri', 5350, 5275],
				['ANTM', 'Aneka Tambang', 2840, 2960]
			].map(([tk, nm, px, prev]) => ({ tk, nm, px, prev, hist: walk(prev, px) }));

			const notes = {
				a: 'Equal tiles, price as the hero number. Simplest port from the table; scales to any count.',
				b: 'First stock gets a 2×2 hero with an intraday line. Needs one extra Yahoo call (interval=5m) for the line.',
				c: 'Box colour = % change, finviz-style. Scan the whole market mood at a glance; exact price is secondary.',
				d: 'Dense dark board, monospace, flashes on each tick. Feels like a trading terminal; always dark.'
			};

			const fmt = new Intl.NumberFormat('id-ID');
			const time = () =>
				new Intl.DateTimeFormat('id-ID', { timeStyle: 'medium', timeZone: 'Asia/Jakarta' }).format(
					new Date()
				);

			function walk(from, to, n = 40) {
				const out = [from];
				for (let i = 1; i < n; i++)
					out.push(from + ((to - from) * i) / n + (Math.random() - 0.5) * from * 0.012);
				out.push(to);
				return out;
			}

			function stats(s) {
				const ch = s.px - s.prev;
				const pct = (ch / s.prev) * 100;
				const cls = ch > 0 ? 'up' : ch < 0 ? 'down' : '';
				const sign = ch > 0 ? '+' : '';
				return { ch, pct, cls, txt: `${sign}${fmt.format(ch)} (${sign}${pct.toFixed(2)}%)` };
			}

			function spark(s) {
				const min = Math.min(...s.hist),
					max = Math.max(...s.hist),
					w = 300,
					h = 70;
				const pts = s.hist
					.map(
						(v, i) => `${(i / (s.hist.length - 1)) * w},${h - ((v - min) / (max - min || 1)) * h}`
					)
					.join(' ');
				const c = s.px >= s.prev ? 'var(--up)' : 'var(--down)';
				return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
			}

			// heat: green/red scaled by |pct|, capped at 5%
			function heat(pct) {
				const a = Math.min(Math.abs(pct) / 5, 1);
				const l = 42 - a * 14;
				return pct >= 0 ? `hsl(146 45% ${l}%)` : `hsl(8 60% ${l + 4}%)`;
			}

			const x = (s) => `<button class="x" aria-label="Remove ${s.tk}">×</button>`;

			const views = {
				a: (s, st) => `
					<div class="tk">${s.tk}</div><div class="nm">${s.nm}</div>
					<div class="px num">${fmt.format(s.px)}</div>
					<div class="ch num ${st.cls}">${st.txt}</div>
					<div class="t num">${time()}</div>${x(s)}`,
				b: (s, st, i) => `
					<div><div class="tk">${s.tk}</div>${i === 0 ? `<div class="nm">${s.nm}</div>` : ''}</div>
					${i === 0 ? spark(s) : ''}
					<div><div class="px num">${fmt.format(s.px)}</div><div class="ch num ${st.cls}">${st.txt}</div></div>${x(s)}`,
				c: (s, st) => `
					<div class="tk">${s.tk}</div>
					<div class="px num">${fmt.format(s.px)}</div>
					<div class="ch num">${st.pct > 0 ? '+' : ''}${st.pct.toFixed(2)}%</div>${x(s)}`,
				d: (s, st) => `
					<div class="row"><span class="tk">${s.tk}</span><span>${time()}</span></div>
					<div class="px num ${st.cls}">${fmt.format(s.px)}</div>
					<div class="ch num ${st.cls}">${st.ch >= 0 ? '▲' : '▼'} ${st.txt}</div>${x(s)}`
			};

			function render(flash = {}) {
				for (const v of Object.keys(views)) {
					document.getElementById(v).innerHTML = stocks
						.map((s, i) => {
							const st = stats(s);
							const style = v === 'c' ? ` style="background:${heat(st.pct)}"` : '';
							const f = flash[s.tk] ? ` ${flash[s.tk]}` : '';
							return `<article class="box${f}"${style}>${views[v](s, st, i)}</article>`;
						})
						.join('');
				}
			}

			document.querySelector('nav').addEventListener('click', (e) => {
				const v = e.target.dataset.v;
				if (!v) return;
				document
					.querySelectorAll('nav button')
					.forEach((b) => b.setAttribute('aria-pressed', b === e.target));
				document.querySelectorAll('.view').forEach((el) => el.classList.toggle('on', el.id === v));
				document.getElementById('note').textContent = notes[v];
			});

			document.querySelector('main').addEventListener('click', (e) => {
				if (!e.target.classList.contains('x')) return;
				const tk = e.target.getAttribute('aria-label').replace('Remove ', '');
				stocks.splice(
					stocks.findIndex((s) => s.tk === tk),
					1
				);
				render();
			});

			document.getElementById('note').textContent = notes.a;
			render();
			setInterval(() => {
				const flash = {};
				for (const s of stocks) {
					if (Math.random() < 0.6) continue;
					const tick = s.px < 200 ? 1 : s.px < 5000 ? 10 : 25; // IDX tick sizes
					const d = (Math.random() < 0.5 ? -1 : 1) * tick;
					s.px += d;
					s.hist.push(s.px);
					s.hist.shift();
					flash[s.tk] = d > 0 ? 'flash-up' : 'flash-down';
				}
				render(flash);
			}, 3000);
		</script>
	</body>
</html>
