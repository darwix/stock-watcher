<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Sell scenarios mock</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				--bg: #0e0f11;
				--card: #131517;
				--card-2: #1a1d20;
				--text: #d9d6cf;
				--muted: #7d7a74;
				--line: #272a2f;
				--up: #5bd68f;
				--down: #ff7a63;
				--accent: #e8c26a;
				color-scheme: dark;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				background: var(--bg);
				color: var(--text);
				font-family: Geist, system-ui, sans-serif;
			}
			.mono {
				font-family: 'Geist Mono', ui-monospace, monospace;
				font-variant-numeric: tabular-nums;
			}
			main {
				max-width: 820px;
				margin: 0 auto;
				padding: 2rem 1rem 4rem;
			}
			header {
				display: flex;
				align-items: center;
				gap: 0.75rem;
				margin-bottom: 1.25rem;
			}
			header a {
				color: var(--muted);
				text-decoration: none;
				font-size: 1.2rem;
			}
			h1 {
				margin: 0;
				font-size: 1.6rem;
				font-weight: 600;
				letter-spacing: -0.02em;
				color: #ecebe8;
			}
			.card {
				background: var(--card);
				border: 1px solid var(--line);
				border-radius: 10px;
				padding: 1rem;
				margin-bottom: 1rem;
			}
			.inputs {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 0.75rem;
			}
			label {
				display: grid;
				gap: 0.35rem;
				font-size: 0.8rem;
				color: var(--muted);
			}
			input {
				width: 100%;
				padding: 0.6rem 0.7rem;
				font:
					500 1rem 'Geist Mono',
					monospace;
				border: 1px solid var(--line);
				border-radius: 6px;
				background: var(--card-2);
				color: var(--text);
			}
			.summary {
				display: flex;
				flex-wrap: wrap;
				gap: 0.4rem 1.5rem;
				margin-top: 0.9rem;
				font-size: 0.85rem;
				color: var(--muted);
			}
			.summary b {
				color: var(--text);
				font-weight: 500;
			}
			table {
				width: 100%;
				border-collapse: collapse;
				font-size: 0.9rem;
			}
			th {
				text-align: right;
				font-weight: 500;
				font-size: 0.75rem;
				color: var(--muted);
				padding: 0 0.5rem 0.6rem;
				border-bottom: 1px solid var(--line);
			}
			td {
				text-align: right;
				padding: 0.6rem 0.5rem;
				border-bottom: 1px solid var(--line);
			}
			th:first-child,
			td:first-child {
				text-align: left;
			}
			tr.be td {
				background: var(--card-2);
			}
			tr.custom td {
				background: color-mix(in srgb, var(--accent) 10%, transparent);
			}
			.tag {
				font-size: 0.65rem;
				padding: 0.1rem 0.4rem;
				border-radius: 4px;
				margin-left: 0.4rem;
				border: 1px solid var(--line);
				color: var(--muted);
				font-family: Geist, sans-serif;
			}
			tr.custom .tag {
				color: var(--accent);
				border-color: var(--accent);
			}
			.up {
				color: var(--up);
			}
			.down {
				color: var(--down);
			}
			.note {
				font-size: 0.75rem;
				color: var(--muted);
				margin-top: 0.75rem;
			}
			@media (max-width: 560px) {
				.inputs {
					grid-template-columns: 1fr 1fr;
				}
				.inputs label:last-child {
					grid-column: 1 / -1;
				}
				.gross,
				.rp {
					display: none;
				}
				td {
					white-space: nowrap;
				}
				.tag {
					margin-left: 0.25rem;
					padding: 0.05rem 0.25rem;
				}
				table {
					font-size: 0.8rem;
				}
				td,
				th {
					padding-left: 0.25rem;
					padding-right: 0.25rem;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<header>
				<a href="#" aria-label="Back">←</a>
				<h1>Sell scenarios</h1>
			</header>

			<section class="card">
				<div class="inputs">
					<label
						>Buy price / share<input id="buy" class="mono" inputmode="numeric" value="8750"
					/></label>
					<label>Lots (×100)<input id="lots" class="mono" inputmode="numeric" value="20" /></label>
					<label
						>Target sell price<input id="sell" class="mono" inputmode="numeric" value="9400"
					/></label>
				</div>
				<div class="summary">
					<span>Buy total <b class="mono" id="total"></b></span>
					<span>Fees buy <b class="mono">0.15%</b> · sell <b class="mono">0.25%</b></span>
				</div>
			</section>

			<section class="card">
				<table>
					<thead>
						<tr>
							<th>Sell price</th>
							<th>Change</th>
							<th class="gross">Gross sale</th>
							<th>Net profit</th>
							<th>Return</th>
						</tr>
					</thead>
					<tbody id="rows"></tbody>
				</table>
				<p class="note">
					Prices snapped to IDX tick size. Profit and return are net of buy and sell fees.
				</p>
			</section>
		</main>

		<script>
			// mock only: real math goes to src/lib/utils with tests
			const BUY_FEE = 0.15,
				SELL_FEE = 0.25;
			const LADDER = [-10, -5, -2, 0, 2, 5, 10, 20];
			const tick = (p) => (p < 200 ? 1 : p < 500 ? 2 : p < 2000 ? 5 : p < 5000 ? 10 : 25);
			const snap = (p) => Math.round(p / tick(p)) * tick(p);
			const rp = (n) =>
				(n < 0 ? '−' : '') +
				'<span class="rp">Rp </span>' +
				Math.round(Math.abs(n)).toLocaleString('id-ID');
			const $ = (id) => document.getElementById(id);

			function render() {
				const buy = +$('buy').value,
					shares = +$('lots').value * 100,
					custom = +$('sell').value;
				const cost = buy * shares * (1 + BUY_FEE / 100);
				$('total').innerHTML = rp(cost);
				const net = (p) => p * shares * (1 - SELL_FEE / 100) - cost;
				let be = snap(buy);
				while (net(be) < 0) be += tick(be);
				const rows = LADDER.map((pct) => ({ p: snap(buy * (1 + pct / 100)) }));
				rows.push({ p: be, kind: 'be', label: 'BE' });
				if (custom) rows.push({ p: custom, kind: 'custom', label: 'target' });
				rows.sort((a, b) => b.p - a.p);
				$('rows').innerHTML = rows
					.map(({ p, kind, label }) => {
						const n = net(p),
							cls = n > 0 ? 'up' : n < 0 ? 'down' : '';
						const chg = ((p / buy - 1) * 100).toFixed(1);
						return `<tr class="${kind || ''}">
							<td class="mono">${p.toLocaleString('id-ID')}${label ? `<span class="tag">${label}</span>` : ''}</td>
							<td class="mono ${cls}">${chg > 0 ? '+' : ''}${chg}%</td>
							<td class="mono gross">${rp(p * shares)}</td>
							<td class="mono ${cls}">${n > 0 ? '+' : ''}${rp(n)}</td>
							<td class="mono ${cls}">${((n / cost) * 100).toFixed(2)}%</td>
						</tr>`;
					})
					.join('');
			}
			document.querySelectorAll('input').forEach((i) => i.addEventListener('input', render));
			render();
		</script>
	</body>
</html>
